<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>具身智能真实执行平台</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="app">
  <header class="top">
    <div class="title">
      <div><small>真实闭环</small><h1>具身智能执行平台</h1></div>
    </div>
    <div id="systemHealth" class="health-strip">
      <span class="health-item" data-component="cloud">Cloud <b>未连接</b></span>
      <span class="health-item" data-component="relay">Relay <b>未连接</b></span>
      <span class="health-item" data-component="isaac">Isaac <b>未连接</b></span>
      <span class="health-item" data-component="livestream">直播 <b>未连接</b></span>
      <span class="health-item" data-component="providers">A/B/D <b>未探测</b></span>
      <span class="health-item" data-component="session">会话 <b id="sessionState">未登录</b></span>
    </div>
    <div class="actions">
      <button id="loginBtn" type="button">登录</button>
      <button id="logoutBtn" type="button" hidden>退出</button>
    </div>
  </header>

  <main class="layout">
    <aside class="left">
      <article class="panel">
        <h2>已验证场景</h2>
        <div id="scenarioList" class="scenario-list"><p class="muted">等待中</p></div>
      </article>
      <article class="panel">
        <h2>任务指令</h2>
        <textarea id="instruction" rows="3" placeholder="例如：把红色方块放到指定放置区域"></textarea>
        <button id="run" type="button" class="primary" disabled>▶ 开始执行</button>
        <p id="runHint" class="muted">需要登录后才能执行</p>
      </article>
    </aside>

    <section class="center">
      <article class="panel">
        <h2>真实执行直播 <span id="livestreamStatus" class="badge badge-off">OFFLINE</span></h2>
        <div class="video-wrap">
          <video id="livestream" controls playsinline></video>
          <p id="livestreamMsg" class="muted">未连接</p>
        </div>
      </article>
      <article class="panel stages">
        <h2>A/B/C/D 阶段状态</h2>
        <div class="stage-row">
          <div class="stage" id="stageA"><b>A 意图理解</b><span class="stage-state">等待中</span><small id="stageADetail">无数据</small></div>
          <div class="stage" id="stageB"><b>B 策略生成</b><span class="stage-state">等待中</span><small id="stageBDetail">无数据</small></div>
          <div class="stage" id="stageC"><b>C Isaac 执行</b><span class="stage-state">等待中</span><small id="stageCDetail">无数据</small></div>
          <div class="stage" id="stageD"><b>D 验证</b><span class="stage-state">等待中</span><small id="stageDDetail">无数据</small></div>
        </div>
      </article>
    </section>

    <aside class="right">
      <article class="panel">
        <h2>运行状态</h2>
        <dl class="run-meta">
          <dt>运行 ID</dt><dd id="runId">—</dd>
          <dt>状态</dt><dd id="runState">无数据</dd>
          <dt>当前动作</dt><dd id="currentAction">无数据</dd>
          <dt>目标</dt><dd id="runTarget">无数据</dd>
          <dt>安全事件</dt><dd id="safetyEvent">无数据</dd>
          <dt>修复尝试</dt><dd id="repairAttempts">无数据</dd>
        </dl>
      </article>
      <article class="panel">
        <h2>结果摘要</h2>
        <div id="resultSummary" class="muted">无数据</div>
        <div id="evidenceSummary" class="muted">无数据</div>
      </article>
    </aside>
  </main>

  <section class="bottom">
    <article class="panel">
      <h2>事件时间线</h2>
      <div id="eventTimeline" class="timeline"><p class="muted">等待中</p></div>
    </article>
  </section>

  <footer class="footer" id="footerNote">连接中…</footer>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/vendor/hls.min.js"></script>
<script src="/app.js"></script>
</body>
</html>
