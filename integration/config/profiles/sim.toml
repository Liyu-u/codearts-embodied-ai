# sim 环境：校内服务器 Isaac Sim 6.0.0 容器，GPU 0，离线，网络关闭。

[profile]
name = "sim"
backend = "isaac"

[workspace]
x_min = -0.5
x_max = 0.7
y_min = -0.5
y_max = 0.5
z_min = 0.0
z_max = 0.6

[motion]
max_linear_velocity_m_s = 0.30
max_angular_velocity_rad_s = 1.0
max_force_n = 10.0
# The official Franka controller runs at ~0.45 s/frame on the school server;
# its first approach phase can take about 120 s after CUDA/IK initialization.
# Keep the safety deadline finite, but above that measured cold-start bound.
action_timeout_s = 180.0
default_linear_speed_m_s = 0.20
grasp_verify_force_n = 0.5

[safety]
require_human_confirmation = false
e_stop_enabled = true
collision_check = true
fail_closed_on_error = true
