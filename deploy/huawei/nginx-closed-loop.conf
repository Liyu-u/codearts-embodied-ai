# Candidate/cutover nginx site for the embodied-ai closed loop.
# - /api/  -> 127.0.0.1:8876 (candidate backend)
# - /live/ -> 127.0.0.1:8888 (MediaMTX HLS, UNCHANGED, operator-owned)
# Install as /etc/nginx/sites-available/closed-loop.conf and enable ONLY after
# candidate gates pass; always run `nginx -t` before reloading nginx.
upstream closed_loop_api {
    server 127.0.0.1:8876;
}

server {
    listen 80;
    server_name _;

    root /opt/codearts/current/demo/frontend;
    index index.html;

    location /api/ {
        proxy_pass http://closed_loop_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /live/ {
        proxy_pass http://127.0.0.1:8888/;
        proxy_set_header Host $host;
    }

    location /vendor/ {
        alias /opt/codearts/current/demo/frontend/vendor/;
        expires 7d;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
