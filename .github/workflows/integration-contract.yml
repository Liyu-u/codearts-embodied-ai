name: integration-contract

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate JSON schemas and examples
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = list(Path('contracts').rglob('*.json')) + list(Path('testdata').rglob('*.json'))
          for p in files:
              json.loads(p.read_text(encoding='utf-8'))
          print(f'contract and example JSON syntax: OK ({len(files)} files)')
          PY
      - name: Run contract and integration tests
        run: python -m unittest discover -s tests -t . -v
